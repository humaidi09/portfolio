<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hussain Ahmed — CSE student & aspiring software engineer. Competitive programmer building clean, correct software with C++, Python, DSA and modern web tech."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Hussain Ahmed" />

    <!--
      Social share preview + SEO. When the custom domain goes live, replace every
      protfolio-hussain8.vercel.app below (and in robots.txt / sitemap.xml) with it.
    -->
    <link rel="canonical" href="https://protfolio-hussain8.vercel.app/" />

    <!-- Open Graph — LinkedIn, Facebook, WhatsApp, Discord, Slack… -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://protfolio-hussain8.vercel.app/" />
    <meta property="og:title" content="Hussain Ahmed — CSE Student & Aspiring Software Engineer" />
    <meta
      property="og:description"
      content="Competitive programmer building clean, correct software with C++, Python, DSA and modern web tech."
    />
    <meta property="og:site_name" content="Hussain Ahmed" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://protfolio-hussain8.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hussain Ahmed — CSE student and aspiring software engineer" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hussain Ahmed — CSE Student & Aspiring Software Engineer" />
    <meta
      name="twitter:description"
      content="Competitive programmer building clean, correct software with C++, Python, DSA and modern web tech."
    />
    <meta name="twitter:image" content="https://protfolio-hussain8.vercel.app/og-image.png" />

    <!-- Set the theme class before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          // Dark-mode-first portfolio: default to dark unless the visitor
          // has explicitly chosen light before.
          var stored = localStorage.getItem('theme');
          var theme = stored || 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Fonts: Fraunces (display serif), Inter (body/UI), JetBrains Mono (structure/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Critical inline styles: paint the warm charcoal background and a branded
      splash INSTANTLY, before the CSS bundle or the JS (React + framer-motion)
      finish loading. Without this the first paint is an empty screen ("black
      flash") while the app compiles. The splash lives inside #root, so React
      removes it automatically the moment it mounts.
    -->
    <style>
      /* Base colour lives on <html> so it paints BEHIND the fixed -z-10 ambient
         canvas. <body> must stay transparent — an opaque body background paints
         above negative-z-index children (CSS paint order) and would hide the
         live network. This is the authoritative rule: it is unlayered and so
         wins over Tailwind's @layer base in index.css. Flat near-black (no wash)
         so the backdrop matches the dark card surfaces. */
      html { background: #000000; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #eae7df;
        background: transparent;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      html.light { background: #f4f2ea; }
      .light body {
        background: transparent;
        color: #1c1a15;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;
      }
      #app-splash .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      #app-splash .ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid rgba(234, 231, 223, 0.12);
        border-top-color: #f2b43d;
        border-right-color: #cf9038;
        animation: splash-spin 0.85s linear infinite;
      }
      #app-splash .mark {
        font-family: "Fraunces", Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: -0.01em;
        color: #f2b43d;
      }
      #app-splash .sub {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #8c897f;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .ring { animation: none; }
      }
    </style>

    <title>Hussain Ahmed — CSE Student & Aspiring Software Engineer</title>
  </head>
  <body>
    <div id="root">
      <!-- Instant branded splash; React replaces #root's contents on mount. -->
      <div id="app-splash" aria-hidden="true">
        <div class="wrap">
          <div class="ring"></div>
          <div class="mark">Hussain Ahmed</div>
          <div class="sub">compiling</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
