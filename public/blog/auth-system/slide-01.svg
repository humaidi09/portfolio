<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#a970ff" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#a970ff"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#a970ff">the system</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 01</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Login &amp; Registration System</text>

  <!-- register chip -->
  <rect x="222" y="336" width="150" height="48" rx="24" fill="#eae7df" fill-opacity="0.05" stroke="#a970ff" stroke-opacity="0.4"/>
  <text x="297" y="366" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b8b3a6">register</text>
  <line x1="384" y1="360" x2="512" y2="360" stroke="#a970ff" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M512 360 l-15 -8 l0 16 z" fill="#a970ff" fill-opacity="0.7"/>

  <!-- login chip -->
  <rect x="908" y="336" width="150" height="48" rx="24" fill="#eae7df" fill-opacity="0.05" stroke="#a970ff" stroke-opacity="0.4"/>
  <text x="983" y="366" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b8b3a6">login</text>
  <line x1="896" y1="360" x2="768" y2="360" stroke="#a970ff" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M768 360 l15 -8 l0 16 z" fill="#a970ff" fill-opacity="0.7"/>

  <!-- shield emblem -->
  <path d="M640 250 L744 286 V356 C744 420 700 452 640 476 C580 452 536 420 536 356 V286 Z" fill="#a970ff" fill-opacity="0.05" stroke="#a970ff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M614 348 v-16 a26 26 0 0 1 52 0 v16" fill="none" stroke="#a970ff" stroke-width="7" stroke-linecap="round"/>
  <rect x="600" y="348" width="80" height="68" rx="12" fill="#a970ff" fill-opacity="0.14" stroke="#a970ff" stroke-width="2.5"/>
  <circle cx="640" cy="376" r="7" fill="#a970ff"/>
  <path d="M640 380 l-6 22 l12 0 z" fill="#a970ff"/>
  <text x="640" y="522" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8c897f">one guard for both</text>

  <text x="64" y="632" font-size="24" fill="#b8b3a6">A file-backed authentication system in C++17. It registers</text>
  <text x="64" y="668" font-size="24" fill="#b8b3a6">users and verifies logins, never storing the password itself.</text>
</svg>
