<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#a970ff" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#a970ff"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#a970ff">login defenses</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 04</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Defenses on every login</text>

  <!-- card 1: constant-time -->
  <rect x="64" y="240" width="360" height="180" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#a970ff" stroke-opacity="0.4"/>
  <text x="244" y="282" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a970ff">01 &#183; timing</text>
  <circle cx="244" cy="332" r="22" fill="none" stroke="#a970ff" stroke-width="2.5"/>
  <line x1="244" y1="332" x2="244" y2="316" stroke="#a970ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="244" y1="332" x2="258" y2="332" stroke="#a970ff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="244" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#eae7df">Constant-time compare</text>
  <text x="244" y="408" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">no early exit on mismatch</text>

  <!-- card 2: lockout -->
  <rect x="460" y="240" width="360" height="180" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#a970ff" stroke-opacity="0.4"/>
  <text x="640" y="282" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a970ff">02 &#183; lockout</text>
  <path d="M628 328 v-10 a12 12 0 0 1 24 0 v10" fill="none" stroke="#a970ff" stroke-width="5" stroke-linecap="round"/>
  <rect x="621" y="328" width="38" height="30" rx="6" fill="#a970ff" fill-opacity="0.14" stroke="#a970ff" stroke-width="2.5"/>
  <circle cx="640" cy="343" r="4" fill="#a970ff"/>
  <text x="640" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#eae7df">Account lockout</text>
  <text x="640" y="408" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">trips after repeated failures</text>

  <!-- card 3: identical error -->
  <rect x="856" y="240" width="360" height="180" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#a970ff" stroke-opacity="0.4"/>
  <text x="1036" y="282" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a970ff">03 &#183; anti-enumeration</text>
  <circle cx="1036" cy="332" r="22" fill="none" stroke="#a970ff" stroke-width="2.5"/>
  <line x1="1025" y1="326" x2="1047" y2="326" stroke="#a970ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="1025" y1="338" x2="1047" y2="338" stroke="#a970ff" stroke-width="3" stroke-linecap="round"/>
  <text x="1036" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#eae7df">One identical error</text>
  <text x="1036" y="408" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">unknown user = wrong password</text>

  <!-- register panel -->
  <rect x="64" y="470" width="1152" height="150" rx="16" fill="#cbb2ff" fill-opacity="0.05" stroke="#cbb2ff" stroke-opacity="0.4"/>
  <text x="92" y="508" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1" fill="#cbb2ff">ON REGISTRATION</text>
  <line x1="620" y1="524" x2="620" y2="596" stroke="#cbb2ff" stroke-opacity="0.2" stroke-width="1.5"/>
  <text x="112" y="558" font-size="22" font-weight="700" fill="#eae7df">Password-strength policy</text>
  <text x="112" y="586" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">enforced before the account is created</text>
  <text x="648" y="558" font-size="22" font-weight="700" fill="#eae7df">Duplicate usernames rejected</text>
  <text x="648" y="586" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">one account per username</text>
</svg>
