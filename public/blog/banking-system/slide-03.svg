<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#26c98a" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#26c98a"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#26c98a">ledger core</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 03</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Money is an integer, not a float</text>

  <!-- float: the problem -->
  <rect x="72" y="240" width="552" height="200" rx="16" fill="#eae7df" fill-opacity="0.04" stroke="#26c98a" stroke-opacity="0.28"/>
  <text x="102" y="284" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">FLOAT &#183; AVOID</text>
  <text x="348" y="344" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="34" fill="#b8b3a6">0.1 + 0.2</text>
  <text x="348" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="21" fill="#8c897f">= 0.30000000000000004</text>
  <text x="348" y="424" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">binary float cannot hold it exactly</text>

  <!-- integer: the fix -->
  <rect x="656" y="240" width="552" height="200" rx="16" fill="#8fe6c1" fill-opacity="0.06" stroke="#8fe6c1" stroke-opacity="0.5"/>
  <text x="686" y="284" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8fe6c1">INT64 MINOR UNITS</text>
  <text x="932" y="344" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="34" fill="#eae7df">10 + 20</text>
  <text x="932" y="392" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="21" fill="#8fe6c1">= 30 &#8594; $0.30</text>
  <text x="932" y="424" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">exact, every time</text>

  <text x="64" y="512" font-size="24" fill="#b8b3a6">A signed 64-bit count of minor units is always exact. Every</text>
  <text x="64" y="550" font-size="24" fill="#b8b3a6">add is checked: <tspan font-family="'JetBrains Mono', monospace" fill="#8fe6c1">tryAdd</tspan> returns false on overflow</text>
  <text x="64" y="588" font-size="24" fill="#b8b3a6">instead of wrapping, so corruption cannot fabricate money.</text>

  <text x="64" y="648" font-family="'JetBrains Mono', monospace" font-size="17" fill="#8c897f">a signed 64-bit count spans about +/- 92 quadrillion minor units</text>
</svg>
