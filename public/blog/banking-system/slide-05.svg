<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#26c98a" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#26c98a"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#26c98a">ledger core</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 05</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Two safety mechanisms</text>

  <!-- atomic transfer -->
  <rect x="72" y="232" width="558" height="340" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <text x="100" y="276" font-family="'JetBrains Mono', monospace" font-size="16" fill="#26c98a">1 &#183; ATOMIC TRANSFER</text>
  <rect x="104" y="308" width="176" height="86" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <text x="192" y="346" text-anchor="middle" font-size="20" fill="#eae7df">account A</text>
  <text x="192" y="376" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8c897f">-120.00</text>
  <line x1="296" y1="351" x2="368" y2="351" stroke="#26c98a" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M368 351 l-16 -9 l0 18 z" fill="#26c98a" fill-opacity="0.7"/>
  <rect x="384" y="308" width="176" height="86" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <text x="472" y="346" text-anchor="middle" font-size="20" fill="#eae7df">account B</text>
  <text x="472" y="376" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8fe6c1">+120.00</text>
  <text x="100" y="444" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">check funds and overflow on both legs first</text>
  <text x="100" y="482" font-size="21" fill="#eae7df">then debit and credit commit together</text>
  <text x="100" y="524" font-family="'JetBrains Mono', monospace" font-size="15" fill="#178f61">any check fails &#8594; nothing moves</text>

  <!-- crash-safe save -->
  <rect x="650" y="232" width="558" height="340" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <text x="678" y="276" font-family="'JetBrains Mono', monospace" font-size="16" fill="#26c98a">2 &#183; CRASH-SAFE SAVE</text>
  <rect x="678" y="308" width="176" height="86" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <text x="766" y="346" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#eae7df">temp file</text>
  <text x="766" y="374" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8c897f">written in full</text>
  <text x="906" y="336" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#26c98a">rename</text>
  <line x1="870" y1="351" x2="942" y2="351" stroke="#26c98a" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M942 351 l-16 -9 l0 18 z" fill="#26c98a" fill-opacity="0.7"/>
  <rect x="958" y="308" width="196" height="86" rx="12" fill="#8fe6c1" fill-opacity="0.06" stroke="#8fe6c1" stroke-opacity="0.5"/>
  <text x="1056" y="346" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#eae7df">bank_data.txt</text>
  <text x="1056" y="374" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8c897f">swapped atomically</text>
  <text x="678" y="444" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">write everything to a temp file, then rename</text>
  <text x="678" y="482" font-size="21" fill="#eae7df">the rename is a single atomic step</text>
  <text x="678" y="524" font-family="'JetBrains Mono', monospace" font-size="15" fill="#178f61">crash before rename &#8594; original intact</text>

  <text x="64" y="626" font-size="24" fill="#b8b3a6">Both mechanisms share one idea: an operation either completes</text>
  <text x="64" y="662" font-size="24" fill="#b8b3a6">fully or not at all, leaving no half-written state behind.</text>
</svg>
