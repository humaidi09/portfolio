<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#26c98a" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#26c98a"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#26c98a">ledger core</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 01</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Banking System</text>

  <!-- coins: the money -->
  <g>
    <g stroke="#26c98a" stroke-opacity="0.5" stroke-width="2">
      <line x1="238" y1="316" x2="238" y2="404"/>
      <line x1="382" y1="316" x2="382" y2="404"/>
    </g>
    <ellipse cx="310" cy="404" rx="72" ry="22" fill="#26c98a" fill-opacity="0.10" stroke="#26c98a" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="310" cy="360" rx="72" ry="22" fill="#26c98a" fill-opacity="0.15" stroke="#26c98a" stroke-opacity="0.7" stroke-width="2"/>
    <ellipse cx="310" cy="316" rx="72" ry="22" fill="#26c98a" fill-opacity="0.22" stroke="#26c98a" stroke-opacity="0.95" stroke-width="2"/>
  </g>
  <text x="310" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">money</text>

  <!-- arrow -->
  <text x="458" y="342" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">backed by</text>
  <line x1="416" y1="360" x2="500" y2="360" stroke="#26c98a" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M500 360 l-16 -9 l0 18 z" fill="#26c98a" fill-opacity="0.7"/>

  <!-- ledger card -->
  <rect x="536" y="262" width="640" height="216" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <text x="566" y="300" font-family="'JetBrains Mono', monospace" font-size="15" fill="#26c98a">LEDGER</text>
  <g font-family="'JetBrains Mono', monospace" font-size="19">
    <text x="566" y="338" fill="#b8b3a6">open</text><text x="1146" y="338" text-anchor="end" fill="#b8b3a6">+0.00</text>
    <text x="566" y="372" fill="#b8b3a6">deposit</text><text x="1146" y="372" text-anchor="end" fill="#b8b3a6">+250.00</text>
    <text x="566" y="406" fill="#b8b3a6">withdraw</text><text x="1146" y="406" text-anchor="end" fill="#b8b3a6">-40.00</text>
  </g>
  <line x1="566" y1="426" x2="1146" y2="426" stroke="#26c98a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="566" y="458" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8fe6c1">balance</text>
  <text x="1146" y="458" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8fe6c1">210.00</text>

  <text x="64" y="556" font-size="24" fill="#b8b3a6">A file-backed banking backend in C++17. Two invariants hold:</text>
  <text x="64" y="596" font-size="24" fill="#b8b3a6">every amount is exact, and every balance is backed by a ledger</text>
  <text x="64" y="636" font-size="24" fill="#b8b3a6">that proves it.</text>
</svg>
