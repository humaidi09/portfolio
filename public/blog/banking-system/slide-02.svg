<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#26c98a" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#26c98a"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#26c98a">ledger core</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 02</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">The two invariants</text>

  <!-- invariant 1 -->
  <rect x="72" y="248" width="552" height="256" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <circle cx="122" cy="306" r="19" fill="#26c98a"/>
  <text x="122" y="314" text-anchor="middle" font-size="22" font-weight="700" fill="#000000">1</text>
  <text x="158" y="316" font-size="30" font-weight="700" fill="#eae7df">Every amount is exact</text>
  <text x="104" y="372" font-size="21" fill="#b8b3a6">Money is a whole count of minor units</text>
  <text x="104" y="404" font-size="21" fill="#b8b3a6">(cents, paisa), never a float. The</text>
  <text x="104" y="436" font-size="21" fill="#b8b3a6">0.1 + 0.2 != 0.3 bug cannot occur.</text>

  <!-- invariant 2 -->
  <rect x="656" y="248" width="552" height="256" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#26c98a" stroke-opacity="0.4"/>
  <circle cx="706" cy="306" r="19" fill="#26c98a"/>
  <text x="706" y="314" text-anchor="middle" font-size="22" font-weight="700" fill="#000000">2</text>
  <text x="742" y="316" font-size="30" font-weight="700" fill="#eae7df">Every balance is backed</text>
  <text x="688" y="372" font-size="21" fill="#b8b3a6">The balance is derived from an</text>
  <text x="688" y="404" font-size="21" fill="#b8b3a6">immutable ledger. A stored total that</text>
  <text x="688" y="436" font-size="21" fill="#b8b3a6">disagrees with its history is rejected.</text>

  <text x="64" y="586" font-size="24" fill="#b8b3a6">Break either invariant and the data is rejected, not trusted.</text>
  <text x="64" y="626" font-size="24" fill="#b8b3a6">These two rules are the whole design.</text>
</svg>
