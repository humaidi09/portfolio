  <!-- combine chevron -->
  <path d="M544 402 l12 11 l12 -11" stroke="#8c897f" stroke-width="2" fill="none"/>
  <text x="600" y="417" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">combine (OR)</text>

