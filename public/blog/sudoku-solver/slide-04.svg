  <!-- right aside: the code -->
  <rect x="792" y="258" width="416" height="200" rx="14" fill="#eae7df" fill-opacity="0.03" stroke="#2597a3" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="814" y="296" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">// digits still legal here</text>
  <text x="814" y="342" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8fe8f1">used = row | col | box</text>
  <text x="814" y="382" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8fe8f1">cand = ~used &amp; 0x1FF</text>
  <line x1="814" y1="406" x2="1186" y2="406" stroke="#2597a3" stroke-opacity="0.35" stroke-width="1"/>
  <text x="814" y="440" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8c897f">&#8594; <tspan fill="#eae7df" font-weight="700">0x108</tspan>  (digits 4, 9)</text>

  <text x="792" y="512" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8fe8f1">&#8594; 4 and 9 fit here</text>

  <text x="64" y="582" font-size="24" fill="#b8b3a6">Each mask is 9 bits: bit 0 means digit 1, bit 8 means digit 9.</text>
  <text x="64" y="618" font-size="24" fill="#b8b3a6">Placing a digit is three ORs; backtracking, three ANDs.</text>
  <text x="64" y="662" font-family="'JetBrains Mono', monospace" font-size="17" fill="#8c897f">legality drops from a 27-cell scan to one bitwise op.</text>
</svg>
