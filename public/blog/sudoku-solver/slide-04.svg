  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">The bitmask, one cell</text>
  <text x="64" y="216" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8c897f">one empty cell &#183; which digits may still go here?</text>

