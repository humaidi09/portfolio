    <text x="602" y="452" fill="#000000" font-weight="700">6</text>
    <text x="648" y="452" fill="#000000" font-weight="700">7</text>
    <text x="694" y="452" fill="#000000" font-weight="700">8</text>
    <text x="740" y="452" fill="#8c897f">9</text>
  </g>

