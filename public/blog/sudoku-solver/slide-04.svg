    <text x="418" y="512" fill="#8c897f">2</text>
    <text x="464" y="512" fill="#8c897f">3</text>
    <text x="510" y="512" fill="#000000" font-weight="700">4</text>
    <text x="556" y="512" fill="#8c897f">5</text>
    <text x="602" y="512" fill="#8c897f">6</text>
    <text x="648" y="512" fill="#8c897f">7</text>
