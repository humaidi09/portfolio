<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#35cfe0" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#35cfe0"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#35cfe0">solver core</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 03</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Backtracking, made fast</text>

  <!-- card A: bitmask -->
  <rect x="72" y="250" width="548" height="200" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#35cfe0" stroke-opacity="0.4"/>
  <text x="96" y="300" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1" fill="#35cfe0">bitmask &#183; O(1) lookup</text>
  <text x="96" y="344" font-size="27" font-weight="700" fill="#eae7df">9 bits per row / col / box</text>
  <text x="96" y="388" font-size="19" fill="#b8b3a6">Legal digits are one bitwise op,</text>
  <text x="96" y="418" font-size="19" fill="#b8b3a6">not a scan of 27 neighbours.</text>

  <!-- card B: MRV -->
  <rect x="660" y="250" width="548" height="200" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#35cfe0" stroke-opacity="0.4"/>
  <text x="684" y="300" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1" fill="#35cfe0">MRV &#183; fail fast</text>
  <text x="684" y="344" font-size="27" font-weight="700" fill="#eae7df">Fewest-candidate cell first</text>
  <text x="684" y="388" font-size="19" fill="#b8b3a6">Dead ends have zero candidates</text>
  <text x="684" y="418" font-size="19" fill="#b8b3a6">and are pruned at once.</text>

  <!-- result strip -->
  <rect x="72" y="484" width="1136" height="86" rx="16" fill="#8fe8f1" fill-opacity="0.06" stroke="#8fe8f1" stroke-opacity="0.5"/>
  <text x="640" y="537" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" fill="#8fe8f1">17-clue puzzles &#8594; milliseconds &#183; world&#8217;s hardest &#8594; ~2 ms</text>

  <text x="64" y="624" font-size="24" fill="#b8b3a6">A plain scan of 1&#8211;9 in reading order drowns in dead ends.</text>
  <text x="64" y="660" font-size="24" fill="#b8b3a6">Both refinements together keep the search tree shallow.</text>
</svg>
