<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="900" height="760" fill="#000000"/>
  <rect x="16" y="16" width="868" height="728" rx="20" fill="none" stroke="#f2b43d" stroke-opacity="0.14"/>

  <circle cx="69" cy="70" r="5" fill="#f2b43d"/>
  <text x="84" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#f2b43d">tournament format</text>
  <text x="62" y="126" font-size="38" font-weight="700" fill="#eae7df">48 teams &#183; 104 matches &#183; 1 champion</text>

  <!-- Funnel bars, centred at x=450 -->
  <g>
    <!-- 48 -->
    <rect x="90" y="170" width="720" height="58" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.5"/>
    <text x="450" y="207" text-anchor="middle"><tspan font-size="30" font-weight="700" fill="#f2b43d">48</tspan><tspan font-size="21" fill="#eae7df">  TEAMS &#8212; draw into 12 groups (A&#8211;L)</tspan></text>

    <path d="M444 236 l6 9 l6 -9" stroke="#8c897f" stroke-width="2" fill="none"/>

    <!-- 32 -->
    <rect x="150" y="262" width="600" height="58" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.55"/>
    <text x="450" y="292" text-anchor="middle"><tspan font-size="28" font-weight="700" fill="#f2b43d">32</tspan><tspan font-size="20" fill="#eae7df">  QUALIFY</tspan></text>
    <text x="450" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">12 winner + 12 runner-up + 8 best third-placed</text>

    <path d="M444 328 l6 9 l6 -9" stroke="#8c897f" stroke-width="2" fill="none"/>

    <!-- 16 -->
    <rect x="240" y="354" width="420" height="52" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.6"/>
    <text x="450" y="387" text-anchor="middle"><tspan font-size="26" font-weight="700" fill="#f2b43d">16</tspan><tspan font-size="19" fill="#eae7df">  Round of 16</tspan></text>

    <path d="M444 414 l6 9 l6 -9" stroke="#8c897f" stroke-width="2" fill="none"/>

    <!-- 8 -->
    <rect x="300" y="440" width="300" height="50" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.65"/>
    <text x="450" y="472" text-anchor="middle"><tspan font-size="24" font-weight="700" fill="#f2b43d">8</tspan><tspan font-size="18" fill="#eae7df">  Quarter-finals</tspan></text>

    <path d="M444 498 l6 9 l6 -9" stroke="#8c897f" stroke-width="2" fill="none"/>

    <!-- 4 -->
    <rect x="340" y="524" width="220" height="48" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.7"/>
    <text x="450" y="555" text-anchor="middle"><tspan font-size="22" font-weight="700" fill="#f2b43d">4</tspan><tspan font-size="17" fill="#eae7df">  Semi-finals</tspan></text>

    <path d="M444 580 l6 9 l6 -9" stroke="#8c897f" stroke-width="2" fill="none"/>

    <!-- 2 -->
    <rect x="370" y="606" width="160" height="46" rx="12" fill="#eae7df" fill-opacity="0.05" stroke="#f6d18c" stroke-opacity="0.8"/>
    <text x="450" y="636" text-anchor="middle"><tspan font-size="21" font-weight="700" fill="#f6d18c">2</tspan><tspan font-size="17" fill="#eae7df">  FINAL</tspan></text>

    <path d="M444 660 l6 9 l6 -9" stroke="#f2b43d" stroke-width="2" fill="none"/>

    <!-- champion -->
    <rect x="330" y="686" width="240" height="52" rx="26" fill="#f2b43d"/>
    <text x="450" y="720" text-anchor="middle" font-size="24" font-weight="700" fill="#000000" letter-spacing="1">CHAMPION</text>
  </g>
</svg>
