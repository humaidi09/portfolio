<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#f2b43d" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#f2b43d"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#f2b43d">how it got built</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 10</text>

  <text x="64" y="164" font-size="52" font-weight="700" fill="#eae7df">From OOP demo to a shipped engine</text>

  <!-- timeline -->
  <line x1="150" y1="300" x2="1140" y2="300" stroke="#cf9038" stroke-width="3"/>

  <g font-family="'JetBrains Mono', monospace">
    <circle cx="150" cy="300" r="9" fill="#cf9038"/>
    <text x="150" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#eae7df" font-family="'Fraunces', Georgia, serif">OOP demo</text>
    <text x="150" y="278" text-anchor="middle" font-size="13" fill="#8c897f">where it began</text>

    <circle cx="420" cy="300" r="9" fill="#f2b43d"/>
    <text x="420" y="344" text-anchor="middle" font-size="19" font-weight="700" fill="#eae7df" font-family="'Fraunces', Georgia, serif">built in 4 phases</text>
    <text x="420" y="366" text-anchor="middle" font-size="13" fill="#8c897f">data &#8594; groups &#8594; knockout &#8594; odds</text>

    <circle cx="680" cy="300" r="9" fill="#f2b43d"/>
    <text x="680" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#eae7df" font-family="'Fraunces', Georgia, serif">Pull Request #1</text>
    <text x="680" y="278" text-anchor="middle" font-size="13" fill="#8c897f">opened for review</text>

    <circle cx="920" cy="300" r="9" fill="#f2b43d"/>
    <text x="920" y="344" text-anchor="middle" font-size="19" font-weight="700" fill="#eae7df" font-family="'Fraunces', Georgia, serif">CI green</text>
    <text x="920" y="366" text-anchor="middle" font-size="13" fill="#8c897f">3 OS &#215; Python 3.10&#8211;3.13</text>

    <circle cx="1140" cy="300" r="14" fill="#f2b43d"/>
    <path d="M1133 300 l5 6 l10 -13" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1140" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#f2b43d" font-family="'Fraunces', Georgia, serif">merged</text>
    <text x="1140" y="274" text-anchor="middle" font-size="13" fill="#8c897f">&#8594; main</text>
  </g>

  <!-- recap -->
  <rect x="64" y="410" width="1152" height="232" rx="16" fill="#f2b43d" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.25"/>
  <text x="92" y="452" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="1" fill="#f2b43d">the whole project in one breath</text>
  <rect x="988" y="424" width="200" height="40" rx="20" fill="#f2b43d" fill-opacity="0.09" stroke="#f2b43d" stroke-opacity="0.7"/>
  <text x="1088" y="450" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="17" letter-spacing="2" fill="#f2b43d">PREDICTION</text>

  <text x="92" y="504" font-size="24" fill="#eae7df">Real teams + real published Elo &#8594; simulate the tournament &#8594; Monte Carlo odds.</text>
  <text x="92" y="546" font-size="24" fill="#b8b3a6">Every result is a prediction, never a real fact. Built in 4 phases, then shipped</text>
  <text x="92" y="588" font-size="24" fill="#b8b3a6">through a real branch &#8594; PR &#8594; CI &#8594; merge &#8212; not a throwaway script.</text>
  <text x="92" y="624" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8c897f">and the original OOP teaching demo still runs, completely untouched.</text>
</svg>
