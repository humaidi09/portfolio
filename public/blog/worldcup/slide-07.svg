<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#f2b43d" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#f2b43d"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#f2b43d">one run</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 07</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Play the whole tournament &#8212; once</text>

  <!-- terminal-style result card -->
  <rect x="290" y="224" width="700" height="300" rx="16" fill="#0d0d10" stroke="#f2b43d" stroke-opacity="0.4"/>
  <text x="320" y="278" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="1" fill="#f2b43d">FINAL RESULT</text>
  <rect x="742" y="252" width="216" height="42" rx="21" fill="#f2b43d" fill-opacity="0.09" stroke="#f2b43d" stroke-opacity="0.75"/>
  <text x="850" y="280" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="2" fill="#f2b43d">PREDICTION</text>
  <line x1="320" y1="300" x2="960" y2="300" stroke="#f2b43d" stroke-opacity="0.18"/>

  <g font-family="'JetBrains Mono', monospace" font-size="24">
    <text x="322" y="348" fill="#8c897f">Champion</text>
    <text x="620" y="348" fill="#f2b43d" font-weight="700">Colombia</text>
    <text x="322" y="392" fill="#8c897f">Runner-up</text>
    <text x="620" y="392" fill="#eae7df">Japan</text>
    <text x="322" y="436" fill="#8c897f">Third place</text>
    <text x="620" y="436" fill="#eae7df">Argentina</text>
    <text x="322" y="480" fill="#8c897f">Fourth place</text>
    <text x="620" y="480" fill="#eae7df">Spain</text>
  </g>
  <text x="320" y="512" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8c897f">$ python -m worldcup run --seed 1 --real-hosts</text>

  <text x="64" y="576" font-size="24" fill="#b8b3a6">One run plays all 104 matches and prints a single champion. This is just</text>
  <text x="64" y="612" font-size="24" fill="#b8b3a6"><tspan font-weight="700" fill="#eae7df">one possible</tspan> tournament (seed 1), upsets and all &#8212; not a claim about reality.</text>
  <text x="64" y="648" font-size="24" fill="#b8b3a6">Change the seed and you get a different, equally valid prediction.</text>
</svg>
