<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#f2b43d" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#f2b43d"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#f2b43d">the engineering</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 09</text>

  <text x="64" y="170" font-size="56" font-weight="700" fill="#eae7df">How the code is organised</text>

  <!-- layer 1 -->
  <rect x="150" y="200" width="980" height="78" rx="14" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.4"/>
  <text x="176" y="238" font-size="24" font-weight="700" fill="#eae7df">The part you type into</text>
  <text x="176" y="266" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">commands go in, results get printed out</text>
  <text x="1106" y="246" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f2b43d">cli.py</text>

  <path d="M634 284 l6 8 l6 -8" stroke="#8c897f" stroke-width="2" fill="none"/>

  <!-- layer 2 -->
  <rect x="150" y="298" width="980" height="78" rx="14" fill="#eae7df" fill-opacity="0.05" stroke="#f2b43d" stroke-opacity="0.4"/>
  <text x="176" y="336" font-size="24" font-weight="700" fill="#eae7df">The organiser</text>
  <text x="176" y="364" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">runs the tournament, saves &amp; loads results safely</text>
  <text x="1106" y="344" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f2b43d">tournament.py</text>

  <path d="M634 382 l6 8 l6 -8" stroke="#8c897f" stroke-width="2" fill="none"/>

  <!-- layer 3 (the brain, star) -->
  <rect x="150" y="396" width="980" height="90" rx="14" fill="#f2b43d" fill-opacity="0.08" stroke="#f2b43d" stroke-opacity="0.6"/>
  <text x="176" y="436" font-size="24" font-weight="700" fill="#eae7df">The brain</text>
  <text x="176" y="466" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">team &#183; Elo &#183; draw &#183; standings &#183; knockout &#8212; pure logic, prints nothing</text>
  <text x="1106" y="442" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f2b43d">core/</text>

  <path d="M634 492 l6 8 l6 -8" stroke="#8c897f" stroke-width="2" fill="none"/>

  <!-- layer 4 (data) -->
  <rect x="150" y="506" width="980" height="78" rx="14" fill="#f6d18c" fill-opacity="0.06" stroke="#f6d18c" stroke-opacity="0.45"/>
  <text x="176" y="544" font-size="24" font-weight="700" fill="#eae7df">The real data</text>
  <text x="176" y="572" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8c897f">48 real teams + a real Elo snapshot (dated &amp; sourced) &#8212; only real data</text>
  <text x="1106" y="552" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f6d18c">teams_2026.json</text>

  <!-- badges -->
  <g font-family="'JetBrains Mono', monospace" font-size="16">
    <rect x="150" y="612" width="228" height="44" rx="22" fill="#f2b43d" fill-opacity="0.07" stroke="#f2b43d" stroke-opacity="0.4"/>
    <text x="264" y="640" text-anchor="middle" fill="#f6d18c">0 outside libraries</text>
    <rect x="392" y="612" width="150" height="44" rx="22" fill="#f2b43d" fill-opacity="0.07" stroke="#f2b43d" stroke-opacity="0.4"/>
    <text x="467" y="640" text-anchor="middle" fill="#f6d18c">102 tests</text>
    <rect x="556" y="612" width="360" height="44" rx="22" fill="#f2b43d" fill-opacity="0.07" stroke="#f2b43d" stroke-opacity="0.4"/>
    <text x="736" y="640" text-anchor="middle" fill="#f6d18c">runs on Windows &#183; macOS &#183; Linux</text>
  </g>
