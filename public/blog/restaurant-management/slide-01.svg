<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" font-family="'Fraunces', Georgia, serif">
  <rect width="1280" height="720" fill="#000000"/>
  <rect x="24" y="24" width="1232" height="672" rx="20" fill="none" stroke="#ff6a4d" stroke-opacity="0.14"/>

  <circle cx="66" cy="70" r="6" fill="#ff6a4d"/>
  <text x="86" y="78" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="1" fill="#ff6a4d">restaurant os</text>
  <text x="1216" y="78" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8c897f">slide 01</text>

  <text x="64" y="176" font-size="56" font-weight="700" fill="#eae7df">Restaurant Management System</text>
  <text x="64" y="224" font-size="24" fill="#b8b3a6">A dependency-free Python CLI for restaurant front-of-house.</text>

  <!-- receipt card -->
  <rect x="440" y="262" width="400" height="292" rx="16" fill="#eae7df" fill-opacity="0.05" stroke="#ff6a4d" stroke-opacity="0.4"/>
  <text x="640" y="304" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8c897f">ORDER #A17  &#183;  TABLE 6</text>
  <line x1="472" y1="322" x2="808" y2="322" stroke="#ff6a4d" stroke-opacity="0.18" stroke-width="1"/>

  <g font-family="'JetBrains Mono', monospace" font-size="21" fill="#eae7df">
    <text x="472" y="362">2  Margherita</text>
    <text x="808" y="362" text-anchor="end">24.00</text>
    <text x="472" y="398">1  Caesar salad</text>
    <text x="808" y="398" text-anchor="end">9.50</text>
    <text x="472" y="434">1  Sparkling water</text>
    <text x="808" y="434" text-anchor="end">3.00</text>
  </g>

  <line x1="472" y1="458" x2="808" y2="458" stroke="#ff6a4d" stroke-opacity="0.18" stroke-width="1"/>
  <text x="472" y="494" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8c897f">Subtotal</text>
  <text x="808" y="494" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="19" fill="#b8b3a6">36.50</text>
  <text x="472" y="530" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#ff6a4d">TOTAL</text>
  <text x="808" y="530" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#ff6a4d">38.81</text>

  <text x="640" y="596" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="17" fill="#8c897f">build a menu &#183; take orders &#183; print a bill that adds up</text>
