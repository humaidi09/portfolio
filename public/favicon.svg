<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hussain Ahmed monogram">
  <defs>
    <!-- Warm two-tone gold — pale highlight down to bronze. Never a rainbow. -->
    <linearGradient id="gold" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d18c" />
      <stop offset="0.5" stop-color="#f2b43d" />
      <stop offset="1" stop-color="#cf9038" />
    </linearGradient>
    <!-- Soft glow behind the mark, matching the site's cover art. -->
    <radialGradient id="glow" cx="32" cy="30" r="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2b43d" stop-opacity="0.16" />
      <stop offset="1" stop-color="#f2b43d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Pure-black tile + faint gold glow + hairline gold frame -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  <rect width="64" height="64" rx="14" fill="url(#glow)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#f2b43d" stroke-opacity="0.32" stroke-width="1.5" />

  <!-- Serif-inflected "H" monogram in gold -->
  <g fill="url(#gold)">
    <!-- posts -->
    <rect x="18" y="17" width="8" height="30" rx="1.5" />
    <rect x="38" y="17" width="8" height="30" rx="1.5" />
    <!-- crossbar -->
    <rect x="18" y="29" width="28" height="6" rx="1" />
    <!-- slab-serif terminals -->
    <rect x="16" y="17" width="12" height="3" rx="1" />
    <rect x="16" y="44" width="12" height="3" rx="1" />
    <rect x="36" y="17" width="12" height="3" rx="1" />
    <rect x="36" y="44" width="12" height="3" rx="1" />
  </g>
</svg>
